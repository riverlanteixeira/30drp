<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caça ao Ladrão da Joia</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Tela de Início -->
    <div id="start-screen" class="fullscreen-overlay">
        <img src="assets/img/emblema.png" alt="Emblema da Polícia Civil de SC">
        <h1>Caça ao Ladrão da Joia</h1>
        <p>Uma aventura de investigação em Realidade Aumentada</p>
        <button id="start-button">Entrar na Investigação</button>
    </div>

    <!-- Cena AR -->
    <a-scene id="ar-scene" vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false;" renderer="antialias: true; alpha: true" style="display: none;">
        <a-camera gps-camera="" rotation-reader=""></a-camera>
    </a-scene>

    <script src="main.js"></script>
</body>
</html>
