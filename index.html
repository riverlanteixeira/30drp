<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caça ao Ladrão da Joia</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Tela de Início -->
    <div id="start-screen" class="fullscreen-overlay">
        <img src="assets/img/emblema.png" alt="Emblema da Polícia Civil de SC">
        <h1>Caça ao Ladrão da Joia</h1>
        <p>Uma aventura de investigação em Realidade Aumentada</p>
        <button id="start-button">Entrar na Investigação</button>
    </div>

    <!-- Cena AR -->
    <a-scene id="ar-scene" vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: true;" renderer="antialias: true; alpha: true" style="display: none;">
        <a-camera gps-camera="" rotation-reader=""></a-camera>

        <!-- Marcador da Pegada -->
        <a-marker preset="hiro" id="marker-pegada">
            <a-image src="assets/img/pegada.png" scale="1 1 1" rotation="-90 0 0" position="0 0.5 0" class="clickable" id="pista-pegada"></a-image>
        </a-marker>

        <!-- Marcador Testemunha 1 (Homem) -->
        <a-marker preset="hiro" id="marker-testemunha1">
            <a-gltf-model src="assets/models/homem.glb" scale="0.5 0.5 0.5" position="0 0 0" rotation="0 0 0" class="clickable" id="pista-testemunha1"></a-gltf-model>
        </a-marker>

        <!-- Marcador Testemunha 2 (Mulher) -->
        <a-marker preset="hiro" id="marker-testemunha2">
            <a-gltf-model src="assets/models/mulher.glb" scale="0.5 0.5 0.5" position="0 0 0" rotation="0 0 0" class="clickable" id="pista-testemunha2"></a-gltf-model>
        </a-marker>

        <!-- Marcador Câmera de Segurança -->
        <a-marker preset="hiro" id="marker-camera">
            <a-gltf-model src="assets/models/camera.glb" scale="0.5 0.5 0.5" position="0 0 0" rotation="0 0 0" class="clickable" id="pista-camera"></a-gltf-model>
        </a-marker>

    </a-scene>

    <!-- Inventário -->
    <div id="inventory-button" class="inventory-button">
        <img src="apple-touch-icon.png" alt="Mochila">
    </div>

    <div id="inventory-overlay" class="fullscreen-overlay" style="display: none;">
        <h2>Inventário</h2>
        <ul id="clues-list"></ul>
        <button id="close-inventory">Fechar</button>
    </div>

    <script src="main.js"></script>
</body>
</html>
